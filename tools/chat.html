<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Playground — Aether Intel</title>
  <meta name="description" content="A premium AI playground. Chat with Claude, GPT-4o, Llama, Gemini and more using your own API key. Your key stays in your browser — zero tracking, zero storage." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://ai.quantummerlin.com/tools/chat.html" />

  <!-- Open Graph -->
  <meta property="og:title" content="AI Playground — Aether Intel" />
  <meta property="og:description" content="A premium AI playground. Claude, GPT-4o, Gemini, Llama — your key, your data, zero tracking." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ai.quantummerlin.com/tools/chat.html" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Site styles -->
  <link rel="stylesheet" href="/css/style.css" />

  <style>
    /* ── Page Layout ── */
    .chat-page {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 0;
      overflow: hidden;
    }

    /* ── Header ── */
    .chat-header {
      flex-shrink: 0;
      padding: 20px 28px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(13,13,26,.99) 0%, rgba(13,13,26,.94) 100%);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .chat-header-left { flex: 1; min-width: 0; }
    .chat-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-display);
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--neon-gold);
      background: rgba(245, 158, 11, .08);
      border: 1px solid rgba(245, 158, 11, .2);
      border-radius: 100px;
      padding: 3px 10px;
      margin-bottom: 8px;
    }
    .chat-badge-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--neon-gold);
      animation: livePulse 1.8s ease-in-out infinite;
    }
    .chat-title {
      font-family: var(--font-heading);
      font-size: clamp(1.25rem, 2.5vw, 1.7rem);
      font-weight: 900;
      color: var(--text-primary);
      margin: 0 0 4px;
      letter-spacing: -.025em;
      line-height: 1.15;
    }
    .chat-title span { color: var(--neon-gold); }
    .chat-subtitle {
      font-size: .82rem;
      color: var(--text-muted);
      margin: 0;
    }
    .chat-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #keyStatus {
      font-size: .8rem;
      color: var(--text-muted);
    }
    .btn-manage-keys {
      font-family: var(--font-display);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--neon-gold);
      background: rgba(245, 158, 11, .08);
      border: 1px solid rgba(245, 158, 11, .22);
      border-radius: 7px;
      padding: 7px 14px;
      cursor: pointer;
      transition: all .18s;
    }
    .btn-manage-keys:hover {
      background: rgba(245, 158, 11, .16);
      border-color: rgba(245, 158, 11, .45);
      color: #c7d2fe;
    }

    /* ── Controls Bar ── */
    .chat-controls {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,20,.7);
      flex-wrap: wrap;
    }
    .model-select-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 400px;
    }
    .model-select-wrap::after {
      content: '▾';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--neon-gold);
      pointer-events: none;
      font-size: .85rem;
    }
    #modelSelect {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(7,7,15,.8);
      border: 1px solid rgba(245, 158, 11, .18);
      border-radius: 9px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: .85rem;
      padding: 9px 34px 9px 13px;
      cursor: pointer;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    #modelSelect:focus {
      border-color: rgba(245, 158, 11, .48);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, .09);
    }
    #modelSelect option, #modelSelect optgroup { background: #0d0d1a; color: var(--text-primary); }
    .model-provider-tag {
      font-family: var(--font-display);
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .05em;
      color: var(--text-muted);
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      white-space: nowrap;
    }
    .btn-sys-prompt {
      font-family: var(--font-display);
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 7px;
      padding: 7px 12px;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
    }
    .btn-sys-prompt:hover, .btn-sys-prompt.active {
      color: var(--neon-cyan);
      border-color: rgba(34,211,238,.3);
      background: rgba(34,211,238,.05);
    }
    .btn-clear-chat {
      font-size: .82rem;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 7px;
      padding: 7px 13px;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
      margin-left: auto;
    }
    .btn-clear-chat:hover {
      color: #f87171;
      border-color: rgba(248,113,113,.3);
      background: rgba(248,113,113,.05);
    }

    /* ── System Prompt Panel ── */
    .sys-prompt-panel {
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(7,7,15,.6);
      overflow: hidden;
      max-height: 0;
      transition: max-height .28s ease, padding .28s ease;
    }
    .sys-prompt-panel.open {
      max-height: 180px;
    }
    .sys-prompt-inner {
      padding: 12px 28px 14px;
    }
    .sys-prompt-label {
      font-family: var(--font-display);
      font-size: .64rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--neon-cyan);
      margin-bottom: 7px;
      display: block;
    }
    #systemPromptInput {
      width: 100%;
      background: rgba(13,13,26,.8);
      border: 1px solid rgba(34,211,238,.15);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: .84rem;
      padding: 9px 13px;
      outline: none;
      resize: vertical;
      min-height: 60px;
      max-height: 120px;
      line-height: 1.55;
      transition: border-color .2s;
      box-sizing: border-box;
    }
    #systemPromptInput:focus { border-color: rgba(34,211,238,.35); }
    #systemPromptInput::placeholder { color: var(--text-muted); }

    /* ── Chat Body ── */
    .chat-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Message List ── */
    #chatMessages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    #chatMessages::-webkit-scrollbar {
      width: 5px;
    }

    #chatMessages::-webkit-scrollbar-track {
      background: transparent;
    }

    #chatMessages::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.25);
      border-radius: 10px;
    }

    /* ── Message Bubbles ── */
    .message {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      animation: msgFadeIn 0.25s ease both;
    }

    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message.system-msg {
      align-self: center;
      align-items: center;
      max-width: 90%;
    }

    .msg-role {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 5px;
      color: var(--text-muted);
    }

    .message.user .msg-role {
      color: rgba(245, 158, 11, 0.7);
    }

    .message.assistant .msg-role {
      color: rgba(34, 211, 238, 0.7);
    }

    .msg-bubble {
      position: relative;
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.65;
      color: var(--text-primary);
      padding: 12px 16px;
      border-radius: 14px;
      word-break: break-word;
    }

    .message.user .msg-bubble {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.35) 0%, rgba(245, 158, 11, 0.22) 100%);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-bottom-right-radius: 4px;
    }

    .message.assistant .msg-bubble {
      background: rgba(19, 19, 38, 0.85);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.system-msg .msg-bubble {
      background: rgba(34, 211, 238, 0.06);
      border: 1px solid rgba(34, 211, 238, 0.15);
      border-radius: 14px;
      color: var(--text-secondary);
      font-size: var(--text-sm);
      text-align: center;
      padding: 14px 22px;
    }

    /* Error state */
    .message.error-msg .msg-bubble {
      background: rgba(248, 113, 113, 0.07);
      border-color: rgba(248, 113, 113, 0.25);
      color: #fca5a5;
    }

    /* ── Inline code in messages ── */
    .msg-bubble code {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 0.85em;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.18);
      border-radius: 4px;
      padding: 1px 5px;
      color: #c7d2fe;
    }

    .msg-bubble pre {
      background: rgba(7, 7, 15, 0.8);
      border: 1px solid rgba(245, 158, 11, 0.15);
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 8px 0 0;
    }

    .msg-bubble pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: var(--text-sm);
      color: #e2e8f0;
    }

    /* ── Copy Button ── */
    .msg-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .message:hover .msg-actions,
    .message:focus-within .msg-actions {
      opacity: 1;
    }

    .btn-copy {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 10px;
      cursor: pointer;
      transition: color var(--transition-fast), background var(--transition-fast), border-color var(--transition-fast);
    }

    .btn-copy:hover {
      color: var(--neon-gold);
      background: rgba(245, 158, 11, 0.08);
      border-color: rgba(245, 158, 11, 0.25);
    }

    .btn-copy.copied {
      color: var(--neon-cyan);
      border-color: rgba(34, 211, 238, 0.3);
    }

    /* ── Typing Indicator ── */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 16px;
      background: rgba(19, 19, 38, 0.85);
      border: 1px solid var(--border);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--neon-gold);
      animation: typingBounce 1.2s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30%            { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Suggested Prompts ── */
    .chat-welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 24px;
      text-align: center;
    }
    .chat-welcome-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, rgba(245, 158, 11, .2), rgba(34,211,238,.1));
      border: 1px solid rgba(245, 158, 11, .25);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
    }
    .chat-welcome-title {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-primary);
      margin: 0;
    }
    .chat-welcome-sub {
      font-size: .84rem;
      color: var(--text-muted);
      margin: -8px 0 0;
      max-width: 320px;
    }
    .suggested-prompts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 520px;
    }
    .suggested-prompt-btn {
      text-align: left;
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      cursor: pointer;
      transition: all .18s;
      font-family: var(--font-body);
      font-size: .8rem;
      color: var(--text-secondary);
      line-height: 1.45;
    }
    .suggested-prompt-btn:hover {
      border-color: rgba(245, 158, 11, .35);
      background: rgba(245, 158, 11, .06);
      color: var(--text-primary);
    }
    .suggested-prompt-icon {
      display: block;
      font-size: .85rem;
      margin-bottom: 5px;
    }

    /* ── No-key Prompt ── */
    .chat-no-key {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 48px 24px;
      text-align: center;
      color: var(--text-secondary);
      font-family: var(--font-body);
    }

    .chat-no-key-icon {
      font-size: 2.5rem;
      opacity: 0.7;
    }

    .chat-no-key h3 {
      font-family: var(--font-heading);
      font-size: var(--text-md);
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
    }

    .chat-no-key p {
      font-size: var(--text-sm);
      color: var(--text-muted);
      max-width: 340px;
      line-height: 1.6;
      margin: 0;
    }

    .btn-add-key {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.8) 0%, rgba(251, 191, 36, 0.7) 100%);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 10px;
      padding: 10px 24px;
      cursor: pointer;
      transition: background var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
    }

    .btn-add-key:hover {
      background: linear-gradient(135deg, rgba(245, 158, 11, 1) 0%, rgba(251, 191, 36, 0.9) 100%);
      box-shadow: var(--glow-indigo);
      transform: translateY(-1px);
    }

    /* ── Input Area ── */
    .chat-input-area {
      flex-shrink: 0;
      padding: 16px 28px 20px;
      border-top: 1px solid var(--border);
      background: rgba(13, 13, 26, 0.97);
    }

    .chat-input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: rgba(7, 7, 15, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 14px;
      padding: 10px 10px 10px 16px;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .chat-input-row:focus-within {
      border-color: rgba(245, 158, 11, 0.45);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.08);
    }

    #chatInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font-body);
      font-size: var(--text-base);
      color: var(--text-primary);
      line-height: 1.6;
      max-height: 160px;
      min-height: 24px;
      overflow-y: auto;
      padding: 0;
    }

    #chatInput::placeholder {
      color: var(--text-muted);
    }

    #chatInput::-webkit-scrollbar {
      width: 3px;
    }

    #chatInput::-webkit-scrollbar-thumb {
      background: rgba(245, 158, 11, 0.2);
      border-radius: 10px;
    }

    .btn-send {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      border: none;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--transition-fast), box-shadow var(--transition-fast), transform var(--transition-fast);
    }

    .btn-send:hover:not(:disabled) {
      background: linear-gradient(135deg, #f97316, #fbbf24);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.45);
      transform: scale(1.05);
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .chat-input-hint {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      color: var(--text-muted);
      margin-top: 8px;
      text-align: right;
      padding-right: 4px;
    }

    /* ── Streaming cursor ── */
    .stream-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--neon-gold);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: cursorBlink 0.8s step-end infinite;
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .chat-header {
        padding: 18px 18px 14px;
      }

      .chat-controls {
        padding: 10px 18px;
        gap: 8px;
      }

      #chatMessages {
        padding: 16px 18px;
        gap: 14px;
      }

      .chat-input-area {
        padding: 12px 18px 14px;
      }

      .message {
        max-width: 90%;
      }

      .chat-title {
        font-size: var(--text-lg);
      }
    }

    @media (max-width: 600px) {
      .chat-badge {
        font-size: 0.65rem;
      }

      .chat-title {
        font-size: 1.25rem;
      }

      .model-select-wrap {
        max-width: 100%;
        width: 100%;
      }

      .btn-clear-chat {
        margin-left: 0;
      }

      .chat-controls {
        flex-wrap: wrap;
      }

      .message {
        max-width: 95%;
      }
    }
  </style>
  <meta name="theme-color" content="#f59e0b">
</head>
<body>
<main>
  <div class="chat-page">

    <!-- ── Header ── -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-badge"><span class="chat-badge-dot"></span>BYOK · Zero Tracking</div>
        <h1 class="chat-title">AI <span>Playground</span></h1>
        <p class="chat-subtitle">Claude, GPT-4o, Gemini, Llama &amp; more — your key, your browser, your data.</p>
      </div>
      <div class="chat-header-actions">
        <span id="keyStatus"></span>
        <button class="btn-manage-keys" data-byok="open">API Keys →</button>
      </div>
    </div>

    <!-- ── Controls ── -->
    <div class="chat-controls">
      <div class="model-select-wrap">
        <select id="modelSelect" aria-label="Select AI model">
          <optgroup label="── Anthropic">
            <option value="anthropic/claude-sonnet-4">Claude Sonnet 4 · Latest</option>
            <option value="anthropic/claude-3.7-sonnet">Claude 3.7 Sonnet</option>
            <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
            <option value="anthropic/claude-3.5-haiku">Claude 3.5 Haiku · Fast</option>
          </optgroup>
          <optgroup label="── OpenAI">
            <option value="openai/gpt-4o">GPT-4o</option>
            <option value="openai/gpt-4o-mini">GPT-4o mini · Efficient</option>
            <option value="openai/gpt-4.1">GPT-4.1</option>
            <option value="openai/o3-mini">o3-mini · Reasoning</option>
          </optgroup>
          <optgroup label="── Google">
            <option value="google/gemini-2.5-flash-preview">Gemini 2.5 Flash · New</option>
            <option value="google/gemini-2.0-flash-001">Gemini 2.0 Flash</option>
            <option value="google/gemini-flash-1.5:free">Gemini 1.5 Flash · Free</option>
          </optgroup>
          <optgroup label="── Open Weight (Free)">
            <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B · Free</option>
            <option value="deepseek/deepseek-r1:free">DeepSeek R1 · Free</option>
            <option value="mistralai/mistral-small-3.1-24b-instruct:free">Mistral Small · Free</option>
            <option value="qwen/qwen-2.5-72b-instruct:free">Qwen 2.5 72B · Free</option>
          </optgroup>
        </select>
      </div>
      <span class="model-provider-tag" id="providerTag">via OpenRouter</span>
      <button class="btn-sys-prompt" id="sysPromptBtn" title="Configure system prompt">System Prompt</button>
      <button class="btn-clear-chat" id="clearChatBtn" title="Clear conversation">Clear</button>
    </div>

    <!-- ── System Prompt Panel ── -->
    <div class="sys-prompt-panel" id="sysPromptPanel">
      <div class="sys-prompt-inner">
        <label class="sys-prompt-label" for="systemPromptInput">System Prompt</label>
        <textarea id="systemPromptInput" rows="3" placeholder="You are a helpful AI assistant. Be concise, accurate, and honest.">You are a helpful AI assistant. Be concise, accurate, and honest.</textarea>
      </div>
    </div>

    <!-- ── Chat Body ── -->
    <div class="chat-body">
      <div id="chatMessages" role="log" aria-live="polite" aria-label="Chat messages"></div>

      <!-- ── Input Area ── -->
      <div class="chat-input-area">
        <div class="chat-input-row">
          <textarea
            id="chatInput"
            rows="1"
            placeholder="Type a message… (Enter to send, Shift+Enter for new line)"
            aria-label="Chat message input"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <button class="btn-send" id="sendBtn" aria-label="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="chat-input-hint">Enter to send · Shift+Enter for new line</div>
      </div>
    </div>

  </div>
</main>

<script>
(function () {
  'use strict';

  // ── Constants ──
  const MODELS = {
    'anthropic/claude-sonnet-4':                        { label: 'Claude Sonnet 4',       provider: 'openrouter', via: 'via OpenRouter' },
    'anthropic/claude-3.7-sonnet':                      { label: 'Claude 3.7 Sonnet',     provider: 'openrouter', via: 'via OpenRouter' },
    'anthropic/claude-3.5-sonnet':                      { label: 'Claude 3.5 Sonnet',     provider: 'openrouter', via: 'via OpenRouter' },
    'anthropic/claude-3.5-haiku':                       { label: 'Claude 3.5 Haiku',      provider: 'openrouter', via: 'via OpenRouter' },
    'openai/gpt-4o':                                    { label: 'GPT-4o',                provider: 'openai',     via: 'via OpenAI' },
    'openai/gpt-4o-mini':                               { label: 'GPT-4o mini',           provider: 'openai',     via: 'via OpenAI' },
    'openai/gpt-4.1':                                   { label: 'GPT-4.1',               provider: 'openai',     via: 'via OpenAI' },
    'openai/o3-mini':                                   { label: 'o3-mini',               provider: 'openai',     via: 'via OpenAI' },
    'google/gemini-2.5-flash-preview':                  { label: 'Gemini 2.5 Flash',      provider: 'openrouter', via: 'via OpenRouter' },
    'google/gemini-2.0-flash-001':                      { label: 'Gemini 2.0 Flash',      provider: 'openrouter', via: 'via OpenRouter' },
    'google/gemini-flash-1.5:free':                     { label: 'Gemini 1.5 Flash',      provider: 'openrouter', via: 'via OpenRouter' },
    'meta-llama/llama-3.3-70b-instruct:free':           { label: 'Llama 3.3 70B',         provider: 'openrouter', via: 'via OpenRouter' },
    'deepseek/deepseek-r1:free':                        { label: 'DeepSeek R1',           provider: 'openrouter', via: 'via OpenRouter' },
    'mistralai/mistral-small-3.1-24b-instruct:free':    { label: 'Mistral Small',         provider: 'openrouter', via: 'via OpenRouter' },
    'qwen/qwen-2.5-72b-instruct:free':                  { label: 'Qwen 2.5 72B',          provider: 'openrouter', via: 'via OpenRouter' }
  };

  const OPENAI_BASE      = 'https://api.openai.com/v1/chat/completions';
  const OPENROUTER_BASE  = 'https://openrouter.ai/api/v1/chat/completions';
  const SITE_URL         = 'https://ai.quantummerlin.com';
  const SITE_NAME        = 'Aether Intel';

  // ── State ──
  let messages = [];      // [{role, content}]
  let isStreaming = false;

  // ── DOM References ──
  const chatMessages    = document.getElementById('chatMessages');
  const chatInput       = document.getElementById('chatInput');
  const sendBtn         = document.getElementById('sendBtn');
  const clearChatBtn    = document.getElementById('clearChatBtn');
  const modelSelect     = document.getElementById('modelSelect');
  const providerTag     = document.getElementById('providerTag');
  const sysPromptBtn    = document.getElementById('sysPromptBtn');
  const sysPromptPanel  = document.getElementById('sysPromptPanel');
  const sysPromptInput  = document.getElementById('systemPromptInput');

  // ── Helper: get selected model info ──
  function getModelInfo() {
    const val = modelSelect.value;
    return MODELS[val] || { label: val, provider: 'openrouter', via: 'via OpenRouter' };
  }

  // ── Helper: get API key (waits for byok.js) ──
  function getApiKey(provider) {
    if (typeof window.getKey === 'function') {
      return window.getKey(provider);
    }
    return localStorage.getItem('byok_' + provider) || null;
  }

  function hasApiKey(provider) {
    return Boolean(getApiKey(provider));
  }

  // ── Update provider tag on model change ──
  function updateProviderTag() {
    const info = getModelInfo();
    providerTag.textContent = info.via;
  }

  modelSelect.addEventListener('change', function () {
    updateProviderTag();
    checkKeyAndEnableInput();
  });

  // ── Enable/disable send based on key availability ──
  function checkKeyAndEnableInput() {
    const info = getModelInfo();
    const keyAvailable = hasApiKey(info.provider);
    const hasText = chatInput.value.trim().length > 0;
    sendBtn.disabled = !keyAvailable || !hasText || isStreaming;
  }

  // ── Auto-resize textarea ──
  function autoResize() {
    chatInput.style.height = 'auto';
    const newH = Math.min(chatInput.scrollHeight, 160);
    chatInput.style.height = newH + 'px';
  }

  chatInput.addEventListener('input', function () {
    autoResize();
    checkKeyAndEnableInput();
  });

  // ── Enter to send, Shift+Enter for newline ──
  chatInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) sendMessage();
    }
  });

  // ── Send button ──
  sendBtn.addEventListener('click', function () {
    if (!sendBtn.disabled) sendMessage();
  });

  // ── Clear chat ──
  clearChatBtn.addEventListener('click', function () {
    messages = [];
    chatMessages.innerHTML = '';
    showWelcome();
    checkKeyAndEnableInput();
  });

  // ── Escape HTML ──
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ── Format message content (basic markdown-lite) ──
  function formatContent(text) {
    // Code blocks first
    text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, function (_, lang, code) {
      return '<pre><code>' + escapeHtml(code.trim()) + '</code></pre>';
    });

    // Inline code
    text = text.replace(/`([^`]+)`/g, function (_, code) {
      return '<code>' + escapeHtml(code) + '</code>';
    });

    // Bold
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

    // Italic
    text = text.replace(/\*(.*?)\*/g, '<em>$1</em>');

    // Newlines to <br> (but not inside pre blocks — already handled)
    text = text.replace(/\n/g, '<br>');

    return text;
  }

  // ── Append a message bubble ──
  function appendMessage(role, content, opts) {
    opts = opts || {};

    // Remove no-key / welcome if present
    chatMessages.querySelectorAll('.chat-no-key, .chat-welcome').forEach(function(el) { el.remove(); });

    const msgEl = document.createElement('div');
    msgEl.className = 'message ' + role + (opts.extraClass ? ' ' + opts.extraClass : '');

    let roleLabel = '';
    if (role === 'user') roleLabel = 'You';
    else if (role === 'assistant') roleLabel = getModelInfo().label;

    const bubbleId = 'bubble-' + Date.now() + '-' + Math.random().toString(36).slice(2);

    let actionsHtml = '';
    if (role === 'assistant' && !opts.noActions) {
      actionsHtml = `
        <div class="msg-actions">
          <button class="btn-copy" data-bubble="${bubbleId}" title="Copy to clipboard">Copy</button>
        </div>`;
    }

    msgEl.innerHTML = `
      ${roleLabel ? `<div class="msg-role">${roleLabel}</div>` : ''}
      <div class="msg-bubble" id="${bubbleId}">${opts.raw ? content : formatContent(content)}</div>
      ${actionsHtml}
    `;

    chatMessages.appendChild(msgEl);
    scrollToBottom();

    // Wire copy button
    if (role === 'assistant' && !opts.noActions) {
      const copyBtn = msgEl.querySelector('.btn-copy');
      if (copyBtn) {
        copyBtn.addEventListener('click', function () {
          const bubbleEl = document.getElementById(bubbleId);
          const rawText = bubbleEl ? bubbleEl.innerText : '';
          navigator.clipboard.writeText(rawText).then(function () {
            copyBtn.textContent = 'Copied!';
            copyBtn.classList.add('copied');
            setTimeout(function () {
              copyBtn.textContent = 'Copy';
              copyBtn.classList.remove('copied');
            }, 2000);
          }).catch(function () {
            copyBtn.textContent = 'Failed';
            setTimeout(function () { copyBtn.textContent = 'Copy'; }, 2000);
          });
        });
      }
    }

    return bubbleId;
  }

  // ── Show typing indicator ──
  function showTyping() {
    const typingEl = document.createElement('div');
    typingEl.className = 'message assistant';
    typingEl.id = 'typingIndicator';
    typingEl.innerHTML = `
      <div class="msg-role">${getModelInfo().label}</div>
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    chatMessages.appendChild(typingEl);
    scrollToBottom();
  }

  // ── Remove typing indicator ──
  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  // ── Scroll to bottom ──
  function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  // ── System prompt toggle ──
  if (sysPromptBtn && sysPromptPanel) {
    sysPromptBtn.addEventListener('click', function() {
      sysPromptPanel.classList.toggle('open');
      sysPromptBtn.classList.toggle('active');
    });
  }

  // ── Get system prompt ──
  function getSystemPrompt() {
    if (sysPromptInput && sysPromptInput.value.trim()) {
      return sysPromptInput.value.trim();
    }
    return 'You are a helpful AI assistant. Be concise, accurate, and honest.';
  }

  // ── Suggested prompts ──
  const SUGGESTED_PROMPTS = [
    { icon: '💡', text: 'Explain a complex topic simply', prompt: 'Explain quantum computing in simple terms, as if to someone with no science background.' },
    { icon: '✍️', text: 'Help me write something', prompt: 'Help me write a compelling cold email to introduce my AI consulting service to a potential client.' },
    { icon: '🔍', text: 'Analyse or review something', prompt: 'What are the most important things to consider when evaluating an AI tool for a small business?' },
    { icon: '🧠', text: 'Think through a problem', prompt: 'I need to decide between building my own AI tool or using an existing platform. Help me think through the trade-offs.' }
  ];

  // ── Show welcome message ──
  function showWelcome() {
    const welcomeEl = document.createElement('div');
    welcomeEl.className = 'chat-welcome';
    welcomeEl.id = 'chatWelcome';

    const promptsHtml = SUGGESTED_PROMPTS.map(function(p) {
      return '<button class="suggested-prompt-btn" data-prompt="' + encodeURIComponent(p.prompt) + '">' +
        '<span class="suggested-prompt-icon">' + p.icon + '</span>' + p.text +
        '</button>';
    }).join('');

    welcomeEl.innerHTML =
      '<div class="chat-welcome-icon">⚡</div>' +
      '<h2 class="chat-welcome-title">AI Playground</h2>' +
      '<p class="chat-welcome-sub">Choose a model above, or start with a suggestion below.</p>' +
      '<div class="suggested-prompts">' + promptsHtml + '</div>';

    chatMessages.appendChild(welcomeEl);

    // Wire suggested prompts
    welcomeEl.querySelectorAll('.suggested-prompt-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var prompt = decodeURIComponent(btn.dataset.prompt || '');
        if (prompt && chatInput) {
          chatInput.value = prompt;
          autoResize();
          checkKeyAndEnableInput();
          chatInput.focus();
        }
      });
    });
  }

  // ── Show no-key prompt ──
  function showNoKeyPrompt(provider) {
    const el = document.createElement('div');
    el.className = 'chat-no-key';
    el.innerHTML = `
      <div class="chat-no-key-icon">🔑</div>
      <h3>Add your API key to start chatting</h3>
      <p>The selected model requires a <strong>${provider === 'openai' ? 'OpenAI' : 'OpenRouter'}</strong> API key. Your key is stored locally in your browser only.</p>
      <button class="btn-add-key" data-byok="open">Add API Key →</button>`;
    chatMessages.appendChild(el);
    scrollToBottom();
  }

  // ── Show inline error ──
  function showError(text) {
    removeTyping();
    appendMessage('assistant', text, { extraClass: 'error-msg', noActions: true });
    isStreaming = false;
    checkKeyAndEnableInput();
  }

  // ── Parse SSE line ──
  function parseSSEData(line) {
    if (!line.startsWith('data: ')) return null;
    const data = line.slice(6).trim();
    if (data === '[DONE]') return '[DONE]';
    try {
      return JSON.parse(data);
    } catch (_) {
      return null;
    }
  }

  // ── Stream response from API ──
  async function streamResponse(apiUrl, apiKey, headers, body, bubbleId) {
    const bubbleEl = document.getElementById(bubbleId);
    if (!bubbleEl) return;

    // Add streaming cursor
    let cursor = document.createElement('span');
    cursor.className = 'stream-cursor';
    bubbleEl.innerHTML = '';
    bubbleEl.appendChild(cursor);

    let fullText = '';

    try {
      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...headers },
        body: JSON.stringify(body)
      });

      if (!response.ok) {
        let errMsg = 'API error ' + response.status;
        try {
          const errJson = await response.json();
          if (errJson.error && errJson.error.message) {
            errMsg = errJson.error.message;
          }
        } catch (_) {}

        // Map common errors to friendly messages
        if (response.status === 401) {
          errMsg = 'Invalid API key. Please check your key in Manage Keys.';
        } else if (response.status === 429) {
          errMsg = 'Rate limit reached. Please wait a moment and try again.';
        } else if (response.status === 402) {
          errMsg = 'Insufficient credits. Please top up your API account.';
        } else if (response.status === 403) {
          errMsg = 'Access denied. Your key may not have permission for this model.';
        }

        // Remove cursor, show error in bubble
        bubbleEl.removeChild(cursor);
        bubbleEl.innerHTML = '';
        bubbleEl.closest('.message').classList.add('error-msg');
        bubbleEl.textContent = 'Error: ' + errMsg;
        isStreaming = false;
        checkKeyAndEnableInput();
        return;
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line in buffer

        for (const line of lines) {
          const parsed = parseSSEData(line.trim());
          if (!parsed || parsed === '[DONE]') continue;

          const delta = parsed.choices?.[0]?.delta?.content;
          if (delta) {
            fullText += delta;

            // Re-render with cursor at end
            const formatted = formatContent(fullText);
            bubbleEl.innerHTML = formatted;
            cursor = document.createElement('span');
            cursor.className = 'stream-cursor';
            bubbleEl.appendChild(cursor);
            scrollToBottom();
          }
        }
      }

      // Final render without cursor
      bubbleEl.innerHTML = formatContent(fullText);
      scrollToBottom();

      // Push to message history
      messages.push({ role: 'assistant', content: fullText });

    } catch (err) {
      bubbleEl.innerHTML = '';
      bubbleEl.closest('.message').classList.add('error-msg');

      let errText = 'Network error. Please check your connection and try again.';
      if (err.name === 'AbortError') {
        errText = 'Request was cancelled.';
      } else if (err.message && err.message.includes('Failed to fetch')) {
        errText = 'Could not reach the API. Check your connection or try again.';
      }

      bubbleEl.textContent = 'Error: ' + errText;
    }

    isStreaming = false;
    checkKeyAndEnableInput();
  }

  // ── Send a message ──
  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text || isStreaming) return;

    const info = getModelInfo();
    const provider = info.provider;
    const apiKey = getApiKey(provider);

    if (!apiKey) {
      // Clear welcome/previous no-key prompt
      chatMessages.querySelectorAll('.chat-no-key, .message.system-msg, .chat-welcome').forEach(function (el) { el.remove(); });
      showNoKeyPrompt(provider);
      return;
    }

    // Clear input
    chatInput.value = '';
    autoResize();

    // Push to history and render
    messages.push({ role: 'user', content: text });
    appendMessage('user', text);

    // Disable input while streaming
    isStreaming = true;
    sendBtn.disabled = true;
    chatInput.disabled = true;

    // Show typing indicator briefly
    showTyping();

    // Prepare API payload
    const fullMessages = [
      { role: 'system', content: getSystemPrompt() },
      ...messages.slice(0, -1).map(function (m) { return { role: m.role, content: m.content }; }),
      { role: 'user', content: text }
    ];

    let apiUrl, headers, modelId;

    if (provider === 'openai') {
      apiUrl = OPENAI_BASE;
      modelId = modelSelect.value.replace('openai/', '');
      headers = {
        'Authorization': 'Bearer ' + apiKey
      };
    } else {
      apiUrl = OPENROUTER_BASE;
      modelId = modelSelect.value;
      headers = {
        'Authorization': 'Bearer ' + apiKey,
        'HTTP-Referer': SITE_URL,
        'X-Title': SITE_NAME
      };
    }

    const body = {
      model: modelId,
      messages: fullMessages,
      stream: true,
      max_tokens: 2048
    };

    // Remove typing, create assistant bubble for streaming
    removeTyping();
    const bubbleId = appendMessage('assistant', '', { raw: true });

    // Re-enable input
    chatInput.disabled = false;
    chatInput.focus();

    await streamResponse(apiUrl, apiKey, headers, body, bubbleId);
  }

  // ── Watch for key changes (storage events from byok modal) ──
  window.addEventListener('storage', function (e) {
    if (e.key && e.key.startsWith('byok_')) {
      checkKeyAndEnableInput();
      // If there's a no-key prompt showing, re-evaluate
      const noKeyEl = chatMessages.querySelector('.chat-no-key');
      if (noKeyEl) {
        const info = getModelInfo();
        if (hasApiKey(info.provider)) {
          noKeyEl.remove();
        }
      }
    }
  });

  // ── Poll for byok.js load then do initial check ──
  function initAfterByok() {
    checkKeyAndEnableInput();

    // If no key for current model, show prompt
    const info = getModelInfo();
    if (!hasApiKey(info.provider)) {
      // Don't auto-show prompt on load — welcome message is sufficient
    }
  }

  // ── Init ──
  function init() {
    updateProviderTag();
    showWelcome();

    // Wait for byok.js (it loads after this script)
    if (typeof window.getKey === 'function') {
      initAfterByok();
    } else {
      // byok.js deferred — poll briefly
      let attempts = 0;
      const poll = setInterval(function () {
        attempts++;
        if (typeof window.getKey === 'function' || attempts > 30) {
          clearInterval(poll);
          initAfterByok();
        }
      }, 100);
    }

    // Also re-check when byok modal closes (it triggers updatePageKeyStatus which we listen for)
    // Extra hook: override updatePageKeyStatus to also re-enable input
    const origUpdate = window.updatePageKeyStatus;
    Object.defineProperty(window, 'updatePageKeyStatus', {
      set: function (fn) { /* ignore overwrites from byok.js */ },
      get: function () { return origUpdate; }
    });

    // Listen for clicks that close the byok modal — re-check keys
    document.addEventListener('click', function (e) {
      if (e.target.closest('#byokClose') || (e.target.id === 'byokModal')) {
        setTimeout(checkKeyAndEnableInput, 50);
      }
      if (e.target.closest('[data-byok-save]') || e.target.closest('[data-byok-clear]')) {
        setTimeout(checkKeyAndEnableInput, 150);
      }
    });
  }

  document.addEventListener('DOMContentLoaded', init);

})();
</script>

  <!-- Site styles -->

  <style>
    /* ── Page Layout ── */
    .tool-page {
      display: flex;
      flex-direction: column;
      gap: 24px;
      padding: 28px 32px 60px;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .tool-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }
    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--neon-cyan);
      background: rgba(34, 211, 238, 0.08);
      border: 1px solid rgba(34, 211, 238, 0.2);
      border-radius: 20px;
      padding: 4px 12px;
      margin-bottom: 12px;
    }
    .tool-title {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      font-weight: 800;
      color: var(--text-primary);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .tool-subtitle {
      font-family: var(--font-body);
      font-size: var(--text-md);
      color: var(--text-secondary);
      margin: 0 0 16px;
      max-width: 640px;
      line-height: 1.55;
    }
    .tool-key-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    #keyStatus {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--text-muted);
    }
    .btn-manage-keys {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--neon-indigo);
      background: rgba(129, 140, 248, 0.08);
      border: 1px solid rgba(129, 140, 248, 0.25);
      border-radius: 8px;
      padding: 5px 14px;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
    }
    .btn-manage-keys:hover {
      background: rgba(129, 140, 248, 0.18);
      border-color: rgba(129, 140, 248, 0.5);
      color: #c7d2fe;
    }

    /* ── Controls Card ── */
    .tool-controls {
      background: var(--surface, #0d0d1a);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .control-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .control-row label {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.01em;
    }
    .control-row textarea,
    .control-row input[type="text"],
    .control-row select {
      width: 100%;
      background: rgba(7, 7, 15, 0.85);
      border: 1px solid rgba(129, 140, 248, 0.2);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: var(--text-md);
      padding: 12px 14px;
      outline: none;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      resize: vertical;
    }
    .control-row textarea:focus,
    .control-row input[type="text"]:focus,
    .control-row select:focus {
      border-color: rgba(129, 140, 248, 0.55);
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.1);
    }
    .control-row select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      padding-right: 36px;
      background-image: linear-gradient(45deg, transparent 50%, var(--neon-indigo) 50%), linear-gradient(135deg, var(--neon-indigo) 50%, transparent 50%);
      background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .control-row select option {
      background: #0d0d1a;
      color: var(--text-primary);
    }
    .control-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }

    /* ── Action Bar ── */
    .tool-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 4px;
    }
    .btn-primary {
      font-family: var(--font-heading);
      font-size: var(--text-md);
      font-weight: 700;
      color: #07070f;
      background: linear-gradient(135deg, var(--neon-indigo), var(--neon-cyan));
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), opacity var(--transition-fast);
      box-shadow: 0 6px 24px rgba(129, 140, 248, 0.18);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(129, 140, 248, 0.28);
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .model-provider-tag {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      white-space: nowrap;
    }

    /* ── Output Panel ── */
    .tool-output {
      background: var(--surface, #0d0d1a);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 28px;
      min-height: 240px;
      position: relative;
    }
    .tool-output.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-family: var(--font-body);
      font-size: var(--text-sm);
    }
    .output-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .output-label {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--neon-indigo);
    }
    .output-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }
    .output-actions button {
      font-family: var(--font-body);
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      transition: color var(--transition-fast), border-color var(--transition-fast), background var(--transition-fast);
    }
    .output-actions button:hover {
      color: var(--text-primary);
      border-color: rgba(129, 140, 248, 0.4);
      background: rgba(129, 140, 248, 0.06);
    }
    .output-body {
      font-family: var(--font-body);
      font-size: var(--text-md);
      color: var(--text-primary);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .output-body h1, .output-body h2, .output-body h3 {
      font-family: var(--font-heading);
      color: var(--text-primary);
      margin-top: 24px;
      margin-bottom: 12px;
    }
    .output-body h1 { font-size: 1.6em; }
    .output-body h2 { font-size: 1.35em; }
    .output-body h3 { font-size: 1.15em; }
    .output-body p { margin: 0 0 14px; }
    .output-body ul, .output-body ol { padding-left: 22px; margin: 0 0 14px; }
    .output-body li { margin-bottom: 6px; }
    .output-body pre {
      background: rgba(7, 7, 15, 0.85);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.9em;
    }
    .output-body code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      background: rgba(129, 140, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.92em;
    }
    .output-body pre code {
      background: transparent;
      padding: 0;
    }
    .output-body blockquote {
      border-left: 3px solid var(--neon-indigo);
      padding: 4px 14px;
      margin: 12px 0;
      color: var(--text-secondary);
      background: rgba(129, 140, 248, 0.05);
      border-radius: 0 6px 6px 0;
    }
    .output-body a {
      color: var(--neon-cyan);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .stream-cursor {
      display: inline-block;
      width: 8px;
      height: 1.2em;
      background: var(--neon-indigo);
      vertical-align: text-bottom;
      animation: cursor-blink 1s infinite;
      margin-left: 2px;
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* ── No-Key Prompt ── */
    .no-key-prompt {
      text-align: center;
      padding: 40px 20px;
    }
    .no-key-prompt .icon { font-size: 2.4rem; margin-bottom: 10px; }
    .no-key-prompt h3 {
      font-family: var(--font-heading);
      font-size: var(--text-lg);
      margin: 0 0 8px;
      color: var(--text-primary);
    }
    .no-key-prompt p {
      font-family: var(--font-body);
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin: 0 0 18px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }
    .no-key-prompt .btn-add-key {
      font-family: var(--font-heading);
      font-size: var(--text-sm);
      font-weight: 700;
      color: #07070f;
      background: linear-gradient(135deg, var(--neon-indigo), var(--neon-cyan));
      border: none;
      border-radius: 10px;
      padding: 10px 22px;
      cursor: pointer;
      letter-spacing: 0.02em;
    }

    /* ── Error State ── */
    .error-banner {
      background: rgba(248, 113, 113, 0.08);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: #fca5a5;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: var(--font-body);
      font-size: var(--text-sm);
      margin-bottom: 14px;
    }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      .tool-page { padding: 18px 16px 40px; }
      .tool-controls { padding: 18px; }
      .tool-output { padding: 18px 18px; }
      .tool-title { font-size: var(--text-xl); }
    }
  </style>

<body>
<main>
  <div class="tool-page">

    <!-- ── Header ── -->
    <header class="tool-header">
      <div class="tool-badge">🛠 FREE BYOK TOOL</div>
      <h1 class="tool-title">AI Writer</h1>
      <p class="tool-subtitle">Articles, emails, scripts, whatever you need. Bring your OpenAI or OpenRouter key. Zero tracking, zero storage.</p>
      <div class="tool-key-bar">
        <span id="keyStatus"></span>
        <button class="btn-manage-keys" data-byok="open">Manage Keys →</button>
      </div>
    </header>

    <!-- ── Controls ── -->
    <section class="tool-controls" aria-label="Tool inputs">
  <div class="control-row">
    <label for="ctrl-prompt">What do you want to write?</label>
    <textarea id="ctrl-prompt" data-ctrl="prompt" rows="6" placeholder="Describe the topic, audience, angle, and any key points to cover." spellcheck="true"></textarea>
  </div>
  <div class="control-grid">
  <div class="control-row">
    <label for="ctrl-format">Format</label>
    <select id="ctrl-format" data-ctrl="format">
      <option value="article" selected>Article</option>
      <option value="blog post">Blog post</option>
      <option value="email">Email</option>
      <option value="LinkedIn post">LinkedIn post</option>
      <option value="Twitter thread">Twitter thread</option>
      <option value="video script">Video script</option>
    </select>
  </div>
  <div class="control-row">
    <label for="ctrl-tone">Tone</label>
    <select id="ctrl-tone" data-ctrl="tone">
      <option value="editorial" selected>Editorial</option>
      <option value="casual">Casual</option>
      <option value="technical">Technical</option>
      <option value="persuasive">Persuasive</option>
      <option value="punchy">Punchy / concise</option>
    </select>
  </div>
  <div class="control-row">
    <label for="ctrl-length">Length</label>
    <select id="ctrl-length" data-ctrl="length">
      <option value="short (250 words)">Short · ~250 words</option>
      <option value="medium (700 words)">Medium · ~700 words</option>
      <option value="long (1500 words)">Long · ~1500 words</option>
      <option value="very long (3000 words)">Very long · ~3000 words</option>
    </select>
  </div>
  </div>

      <div class="control-row">
        <label for="ctrl-model">AI Model</label>
        <select id="ctrl-model" data-ctrl="model">
        <option value="anthropic/claude-sonnet-4.5" selected>Claude Sonnet 4.5 · Best quality</option>
        <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet · Proven, cheaper</option>
        <option value="openai/gpt-4o">GPT-4o · Balanced</option>
        <option value="openai/gpt-4o-mini">GPT-4o mini · Fast &amp; cheap</option>
        <option value="meta-llama/llama-3.1-70b-instruct:free">Llama 3.1 70B · Free</option>
        <option value="google/gemini-flash-1.5:free">Gemini Flash · Free</option>
        </select>
      </div>

      <div class="tool-actions">
        <button id="runBtn" class="btn-primary" disabled>Write</button>
        <span class="model-provider-tag" id="providerTag">via OpenRouter</span>
      </div>
    </section>

    <!-- ── Output ── -->
    <section class="tool-output empty" id="outputPanel" aria-live="polite">
      <span>Your result will appear here.</span>
    </section>

  </div>
</main>

<script>
(function () {
  'use strict';

  // ── Config ──
  const SYSTEM_PROMPT = `You are an expert long-form writer for Aether Intel. Produce clean, well-structured markdown. Use headings, paragraphs, and lists where they help. Be specific over generic. No filler, no disclaimers, no apologies. Match the requested tone and length precisely.`;
  const PROMPT_TEMPLATE = `Write a {length} piece in a {tone} tone, formatted as {format}.

Topic / brief:
{prompt}`;
  const MAX_TOKENS = 4096;
  const MODELS = {
    "anthropic/claude-sonnet-4.5": { label: "Claude Sonnet 4.5 \u00b7 Best quality", provider: "openrouter", via: "via OpenRouter" },
    "anthropic/claude-3.5-sonnet": { label: "Claude 3.5 Sonnet \u00b7 Proven, cheaper", provider: "openrouter", via: "via OpenRouter" },
    "openai/gpt-4o": { label: "GPT-4o \u00b7 Balanced", provider: "openai", via: "via OpenAI" },
    "openai/gpt-4o-mini": { label: "GPT-4o mini \u00b7 Fast & cheap", provider: "openai", via: "via OpenAI" },
    "meta-llama/llama-3.1-70b-instruct:free": { label: "Llama 3.1 70B \u00b7 Free", provider: "openrouter", via: "via OpenRouter" },
    "google/gemini-flash-1.5:free": { label: "Gemini Flash \u00b7 Free", provider: "openrouter", via: "via OpenRouter" },
  };
  const OPENAI_BASE     = 'https://api.openai.com/v1/chat/completions';
  const OPENROUTER_BASE = 'https://openrouter.ai/api/v1/chat/completions';
  const SITE_URL        = 'https://ai.quantummerlin.com';
  const SITE_NAME       = 'Aether Intel';
  const OUTPUT_FILENAME = 'writer-output.md';

  let isStreaming = false;
  let lastOutput = '';

  const runBtn      = document.getElementById('runBtn');
  const outputPanel = document.getElementById('outputPanel');
  const providerTag = document.getElementById('providerTag');
  const modelSelect = document.getElementById('ctrl-model');

  // ── Helpers ──
  function getApiKey(provider) {
    if (typeof window.getKey === 'function') return window.getKey(provider);
    return localStorage.getItem('byok_' + provider) || null;
  }
  function hasApiKey(provider) { return Boolean(getApiKey(provider)); }

  function getModelInfo() {
    const v = modelSelect.value;
    return MODELS[v] || { label: v, provider: 'openrouter', via: 'via OpenRouter' };
  }

  function updateProviderTag() {
    providerTag.textContent = getModelInfo().via;
  }

  function getControlValue(id) {
    const el = document.querySelector('[data-ctrl="' + id + '"]');
    if (!el) return '';
    return el.value || '';
  }

  function getRequiredControls() {
    return Array.from(document.querySelectorAll('[data-ctrl]'))
      .filter(el => el.id !== 'ctrl-model');
  }

  function isReady() {
    if (isStreaming) return false;
    if (!hasApiKey(getModelInfo().provider)) return false;
    // Require the first textarea/text input to be non-empty
    const primary = document.querySelector('textarea[data-ctrl], input[data-ctrl]');
    if (primary && primary.tagName !== 'SELECT' && !primary.value.trim()) return false;
    return true;
  }

  function refreshButton() {
    runBtn.disabled = !isReady();
  }

  // ── Markdown formatting (lightweight) ──
  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function formatMarkdown(text) {
    let html = text;
    // fenced code
    html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, function(_, lang, code) {
      return '<pre><code>' + escapeHtml(code.trim()) + '</code></pre>';
    });
    // inline code
    html = html.replace(/`([^`]+)`/g, function(_, c) { return '<code>' + escapeHtml(c) + '</code>'; });
    // headings
    html = html.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.*?)$/gm, '<h1>$1</h1>');
    // bold/italic
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // links
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    // bullet list
    html = html.replace(/(^|\n)([-*] .+(?:\n[-*] .+)*)/g, function(m, lead, block) {
      const items = block.split(/\n/).map(l => l.replace(/^[-*] /, '')).map(li => '<li>' + li + '</li>').join('');
      return lead + '<ul>' + items + '</ul>';
    });
    // numbered list
    html = html.replace(/(^|\n)((?:\d+\. .+(?:\n\d+\. .+)*))/g, function(m, lead, block) {
      const items = block.split(/\n/).map(l => l.replace(/^\d+\. /, '')).map(li => '<li>' + li + '</li>').join('');
      return lead + '<ol>' + items + '</ol>';
    });
    // paragraphs (lines not already wrapped)
    const lines = html.split(/\n\n+/);
    html = lines.map(seg => {
      if (/^<(h\d|ul|ol|pre|blockquote)/.test(seg.trim())) return seg;
      if (!seg.trim()) return '';
      return '<p>' + seg.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');
    return html;
  }

  // ── Build the final prompt by interpolating control values into PROMPT_TEMPLATE ──
  function buildUserPrompt() {
    let prompt = PROMPT_TEMPLATE;
    document.querySelectorAll('[data-ctrl]').forEach(el => {
      const key = el.getAttribute('data-ctrl');
      if (key === 'model') return;
      prompt = prompt.replace(new RegExp('\\{' + key + '\\}', 'g'), el.value || '');
    });
    return prompt;
  }

  function showNoKeyPrompt(provider) {
    outputPanel.classList.remove('empty');
    outputPanel.innerHTML =
      '<div class="no-key-prompt">' +
        '<div class="icon">🔑</div>' +
        '<h3>Add your API key to continue</h3>' +
        '<p>This model needs a <strong>' + (provider === 'openai' ? 'OpenAI' : 'OpenRouter') +
        '</strong> key. Your key stays in your browser only — no servers, no tracking.</p>' +
        '<button class="btn-add-key" data-byok="open">Add API Key →</button>' +
      '</div>';
  }

  function setOutputShellForStreaming() {
    outputPanel.classList.remove('empty');
    outputPanel.innerHTML =
      '<div class="output-header">' +
        '<span class="output-label">Result</span>' +
        '<div class="output-actions">' +
          '<button id="btnCopy" type="button">Copy</button>' +
          '<button id="btnDownload" type="button">Download .md</button>' +
        '</div>' +
      '</div>' +
      '<div class="output-body" id="outputBody"></div>';

    document.getElementById('btnCopy').addEventListener('click', function () {
      navigator.clipboard.writeText(lastOutput).then(function () {
        const b = document.getElementById('btnCopy');
        b.textContent = 'Copied!';
        setTimeout(() => { b.textContent = 'Copy'; }, 1500);
      });
    });
    document.getElementById('btnDownload').addEventListener('click', function () {
      const blob = new Blob([lastOutput], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = OUTPUT_FILENAME;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  }

  function parseSSE(line) {
    if (!line.startsWith('data: ')) return null;
    const data = line.slice(6).trim();
    if (data === '[DONE]') return '[DONE]';
    try { return JSON.parse(data); } catch (_) { return null; }
  }

  async function runRequest() {
    if (!isReady()) return;
    const info = getModelInfo();
    const provider = info.provider;
    const apiKey = getApiKey(provider);
    if (!apiKey) { showNoKeyPrompt(provider); return; }

    const userPrompt = buildUserPrompt();
    setOutputShellForStreaming();
    const body = document.getElementById('outputBody');
    const cursor = document.createElement('span');
    cursor.className = 'stream-cursor';
    body.appendChild(cursor);

    isStreaming = true;
    runBtn.disabled = true;
    runBtn.textContent = 'Generating…';
    lastOutput = '';

    let apiUrl, headers, modelId;
    if (provider === 'openai') {
      apiUrl = OPENAI_BASE;
      modelId = modelSelect.value.replace('openai/', '');
      headers = { 'Authorization': 'Bearer ' + apiKey };
    } else {
      apiUrl = OPENROUTER_BASE;
      modelId = modelSelect.value;
      headers = {
        'Authorization': 'Bearer ' + apiKey,
        'HTTP-Referer': SITE_URL,
        'X-Title': SITE_NAME
      };
    }

    const payload = {
      model: modelId,
      messages: [
        { role: 'system', content: SYSTEM_PROMPT },
        { role: 'user',   content: userPrompt }
      ],
      stream: true,
      max_tokens: MAX_TOKENS
    };

    try {
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...headers },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        let msg = 'API error ' + res.status;
        try {
          const j = await res.json();
          if (j.error && j.error.message) msg = j.error.message;
        } catch (_) {}
        if (res.status === 401) msg = 'Invalid API key. Check your key in Manage Keys.';
        if (res.status === 429) msg = 'Rate limit reached. Wait a moment and try again.';
        if (res.status === 402) msg = 'Insufficient credits. Top up your API account.';
        body.innerHTML = '<div class="error-banner">Error: ' + msg + '</div>';
        isStreaming = false;
        runBtn.textContent = 'Write';
        refreshButton();
        return;
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          const parsed = parseSSE(line.trim());
          if (!parsed || parsed === '[DONE]') continue;
          const delta = parsed.choices?.[0]?.delta?.content;
          if (delta) {
            lastOutput += delta;
            body.innerHTML = formatMarkdown(lastOutput);
            const c = document.createElement('span');
            c.className = 'stream-cursor';
            body.appendChild(c);
            outputPanel.scrollTop = outputPanel.scrollHeight;
          }
        }
      }

      body.innerHTML = formatMarkdown(lastOutput);
    } catch (err) {
      body.innerHTML = '<div class="error-banner">Network error. ' + (err.message || '') + '</div>';
    }

    isStreaming = false;
    runBtn.textContent = 'Write';
    refreshButton();
  }

  // ── Wire up ──
  runBtn.addEventListener('click', runRequest);
  document.querySelectorAll('[data-ctrl]').forEach(el => {
    el.addEventListener('input',  refreshButton);
    el.addEventListener('change', function () {
      refreshButton();
      if (el.id === 'ctrl-model') updateProviderTag();
    });
  });

  window.addEventListener('storage', function (e) {
    if (e.key && e.key.startsWith('byok_')) refreshButton();
  });

  function init() {
    updateProviderTag();
    refreshButton();
    if (typeof window.getKey !== 'function') {
      let n = 0;
      const t = setInterval(() => {
        n++;
        if (typeof window.getKey === 'function' || n > 30) {
          clearInterval(t);
          refreshButton();
        }
      }, 100);
    }
    document.addEventListener('click', function (e) {
      if (e.target.closest('#byokClose') || e.target.id === 'byokModal' ||
          e.target.closest('[data-byok-save]') || e.target.closest('[data-byok-clear]')) {
        setTimeout(refreshButton, 100);
      }
    });
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>

<script src="/js/main.js"></script>
<script src="/js/byok.js"></script>

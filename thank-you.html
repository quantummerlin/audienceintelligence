<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're In — Aether Intelligence</title>
    <meta name="robots" content="noindex">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-VW4LGE7L1T"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-VW4LGE7L1T');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --text-primary: #f0f0f5;
            --text-secondary: #8888a0;
            --accent: #6366f1;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }
        .bg-gradient {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.08) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }
        .card {
            position: relative; z-index: 1;
            background: var(--bg-card);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 24px;
            padding: 56px 48px;
            max-width: 520px;
            width: 100%;
        }
        .check-circle {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 28px;
            font-size: 2rem;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #a0a0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.65;
        }
        .freebie-box {
            background: rgba(99,102,241,0.06);
            border: 1px solid rgba(99,102,241,0.18);
            border-radius: 14px;
            padding: 20px 24px;
            margin-bottom: 32px;
        }
        .freebie-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 6px;
        }
        .freebie-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .freebie-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .btn-primary {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(99,102,241,0.35);
            margin-bottom: 20px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99,102,241,0.45);
        }
        .back-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .back-links a {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-links a:hover { color: var(--text-primary); }
        @media (max-width: 560px) {
            .card { padding: 40px 24px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <div class="card" id="mainCard">
        <div class="check-circle">✓</div>
        <h1 id="pageTitle">You're in.</h1>
        <p class="sub" id="pageSub">Your freebie is ready below. Check your inbox — the first signal brief lands next Monday.</p>

        <div class="freebie-box" id="freebieBox">
            <div class="freebie-label">Your free resource</div>
            <div class="freebie-title" id="freebieTitle">Loading…</div>
            <div class="freebie-desc" id="freebieDesc"></div>
        </div>

        <a href="#" id="freebieLink" class="btn-primary">View Your Free Resource →</a>

        <div class="back-links">
            <a href="index.html">← Back to Reports</a>
            <a href="trends.html">Trends</a>
            <a href="startup-ideas.html">Startup Ideas</a>
            <a href="patterns.html">Patterns</a>
        </div>
    </div>

    <script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const type = params.get('freebie') || 'brief';

        const config = {
            brief: {
                title: 'Weekly Signal Brief',
                sub: 'Your first brief is below. New editions land every Monday — what\'s rising before it goes mainstream.',
                freebieTitle: 'Sample Signal Brief — April 2026',
                freebieDesc: '5 signals, ranked by momentum. Extracted this week.',
                link: 'free-signal-brief.html',
                linkText: 'Read Your Free Signal Brief →'
            },
            scorecard: {
                title: 'Scorecard is yours.',
                sub: 'Your Demand Evidence Scorecard is ready. Use it to pressure-test any startup idea in under 10 minutes.',
                freebieTitle: 'Demand Evidence Scorecard',
                freebieDesc: '8-point framework for validating startup ideas with real conversation data.',
                link: 'free-startup-scorecard.html',
                linkText: 'Open Your Free Scorecard →'
            },
            atlas: {
                title: 'Atlas unlocked.',
                sub: 'The Human Pattern Atlas sample is ready. 7 of the most powerful recurring patterns from 200,000+ conversations.',
                freebieTitle: 'Human Pattern Atlas — Sample Edition',
                freebieDesc: '7 deep behavior patterns with quotes, frequency data, and strategic insights.',
                link: 'free-pattern-atlas.html',
                linkText: 'Open Your Pattern Atlas →'
            }
        };

        const c = config[type] || config.brief;
        document.getElementById('pageTitle').textContent = c.title;
        document.getElementById('pageSub').textContent = c.sub;
        document.getElementById('freebieTitle').textContent = c.freebieTitle;
        document.getElementById('freebieDesc').textContent = c.freebieDesc;
        const link = document.getElementById('freebieLink');
        link.href = c.link;
        link.textContent = c.linkText;
    })();
    </script>
</body>
</html>

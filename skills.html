  <style>
    /* ── Page hero ── */
    .skills-hero { padding:48px 28px 36px; border-bottom:1px solid var(--border); }
    .skills-hero-label { font-family:var(--font-display); font-size:.62rem; font-weight:700; letter-spacing:.18em; color:var(--neon-indigo); text-transform:uppercase; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .skills-hero-label::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--neon-indigo); animation:livePulse 1.8s ease-in-out infinite; display:inline-block; }
    .skills-hero-title { font-family:var(--font-heading); font-size:clamp(1.6rem,4vw,2.4rem); font-weight:800; line-height:1.15; margin-bottom:12px; }
    .skills-hero-sub { color:var(--text-secondary); font-size:.92rem; max-width:540px; line-height:1.65; margin-bottom:20px; }
    .skills-hero-stats { display:flex; gap:24px; flex-wrap:wrap; }
    .skills-stat { display:flex; flex-direction:column; }
    .skills-stat-num { font-family:var(--font-heading); font-size:1.4rem; font-weight:700; color:var(--neon-indigo); line-height:1; }
    .skills-stat-label { font-family:var(--font-display); font-size:.6rem; color:var(--text-muted); letter-spacing:.1em; margin-top:2px; text-transform:uppercase; }

    /* ── Skills grid ── */
    .skills-section { padding:32px 28px 48px; }
    .skills-section-title { font-family:var(--font-heading); font-size:1.1rem; font-weight:700; margin-bottom:20px; }
    .skills-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }

    /* ── Skill card ── */
    .skill-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-card); padding:20px; display:flex; flex-direction:column; gap:12px; transition:border-color .2s,box-shadow .2s; }
    .skill-card:hover { border-color:var(--border-bright); box-shadow:var(--glow-indigo); }
    .skill-card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .skill-card-name { font-family:var(--font-heading); font-size:.95rem; font-weight:700; line-height:1.3; }
    .skill-card-type { font-family:var(--font-display); font-size:.58rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-top:4px; }
    .skill-card-desc { font-size:.82rem; color:var(--text-secondary); line-height:1.55; flex:1; }
    .skill-card-compat { display:flex; flex-wrap:wrap; gap:6px; }
    .skill-compat-tag { background:rgba(129,140,248,.08); border:1px solid var(--border); border-radius:10px; padding:3px 9px; font-family:var(--font-display); font-size:.58rem; font-weight:700; color:var(--text-muted); letter-spacing:.06em; }
    .skill-card-footer { display:flex; align-items:center; justify-content:space-between; padding-top:4px; border-top:1px solid var(--border); }
    .skill-card-meta { font-family:var(--font-display); font-size:.6rem; color:var(--text-muted); }
    .skill-download-btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; background:rgba(129,140,248,.1); border:1px solid rgba(129,140,248,.3); border-radius:8px; font-family:var(--font-display); font-size:.62rem; font-weight:700; letter-spacing:.06em; color:var(--neon-indigo); text-decoration:none; transition:background .2s,border-color .2s; cursor:pointer; }
    .skill-download-btn:hover { background:rgba(129,140,248,.2); border-color:var(--neon-indigo); }

    /* ── Empty state ── */
    .skills-coming { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-muted); }
    .skills-coming-icon { font-size:2.5rem; margin-bottom:16px; opacity:.4; }
    .skills-coming-text { font-family:var(--font-heading); font-size:1rem; font-weight:600; margin-bottom:8px; }
    .skills-coming-sub { font-size:.82rem; }

    @media(max-width:900px) { .skills-hero { padding:32px 16px 24px; } .skills-section { padding:24px 16px 32px; } }
